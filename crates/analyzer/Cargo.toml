[package]
name = "codebasecanvas-analyzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[[bin]]
name = "codebasecanvas"
path = "src/main.rs"

[dependencies]
oxc_allocator = "=0.148.0"
oxc_ast = "=0.148.0"
oxc_ast_visit = "=0.148.0"
oxc_parser = "=0.148.0"
oxc_span = "=0.148.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.6.6", default-features = false, features = ["std", "help", "usage", "error-context"] }

[dev-dependencies]
oxc_semantic = "=0.148.0"
oxc_resolver = "=11.24.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
